<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Voting System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .forgot-container {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        input[type="email"]:focus {
            border-color: #4facfe;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79,172,254,0.2);
        }

        button {
            background: #4facfe;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: #00c6ff;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #4facfe;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #00c6ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <h2>Forgot Password</h2>
        <form id="forgotForm">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit" id="forgotBtn">Send Reset Link</button>
        </form>
        <div class="links">
            <a href="login.html">&larr; Back to Login</a>
        </div>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const forgotBtn = document.getElementById('forgotBtn');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            forgotBtn.disabled = true;
            forgotBtn.textContent = 'Sending...';

            const formData = new FormData(forgotForm);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if(result.success){
                    Swal.fire({
                        icon:'success',
                        title:'Reset Link Sent',
                        text:'Please check your email for the password reset link.',
                        timer: 2500,
                        showConfirmButton: false
                    }).then(() => forgotForm.reset());
                } else {
                    Swal.fire({ icon:'error', title:'Error', text: result.message });
                }
            } catch(err){
                Swal.fire({ icon:'error', title:'Server Error', text:'Please try again later.' });
            } finally {
                forgotBtn.disabled = false;
                forgotBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
