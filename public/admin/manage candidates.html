<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Candidates</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    .voter-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      width: 95%;
      max-width: 1000px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      color: #fff;
      text-align: center;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    button {
      padding: 14px 24px;
      background-color: #fff;
      color: #2980b9;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
      min-width: 100px;
      margin: 2px;
    }
    button:hover {
      background-color: #2980b9;
      color: #fff;
    }
    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin: 10px 5px;
      width: 200px;
    }
    table {
      margin: 20px auto;
      width: 90%;
      color: #fff;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    .button-grid a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="voter-container">
    <h2>Manage Candidates</h2>

    <form method="POST" action="/candidates/add">
      <input type="text" name="candidate_name" placeholder="Candidate Name" required>
      <input type="text" name="position" placeholder="Position" required>
      <button type="submit">Add Candidate</button>
    </form>

    <table>
      <thead>
        <tr><th>Name</th><th>Position</th><th>Action</th></tr>
      </thead>
      <tbody id="candidateTableBody">
        <!-- Candidate rows will go here -->
      </tbody>
    </table>

    <div class="button-grid">
      <a href="dash.html"><button>Back to Dashboard</button></a>
    </div>
  </div>

  <script>
    // Optional: Fetch and display candidate list dynamically
    fetch('/candidates')
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('candidateTableBody');
        data.forEach(candidate => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${candidate.name}</td>
            <td>${candidate.position}</td>
            <td>
              <form action="/candidates/delete" method="POST" style="display:inline;">
                <input type="hidden" name="id" value="${candidate.id}">
                <button type="submit">Delete</button>
              </form>
            </td>
          `;
          tbody.appendChild(row);
        });
      });
  </script>
</body>
</html>
