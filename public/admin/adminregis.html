<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        #register-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            color: #fff;
            text-align: left;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #fff;
        }
        input[type="text"],
        input[type="password"] {
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            width: 100%;
            font-size: 16px;
        }
        input[type="submit"] {
            background-color: #0683f0;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #0685a8;
        }
        p {
            text-align: center;
            margin-top: 15px;
        }
        a {
            color: #fff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="register-box">
        <h2>Admin Registration</h2>

        <form action="admin-register.php" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <label for="admin_code">Admin Code:</label>
            <input type="password" id="admin_code" name="admin_code" placeholder="Enter secret code" required>

            <input type="submit" value="Register Admin">
        </form>

        <p><a href="login.html">&larr; Back to Login</a></p>
    </div>
</body>
</html>
