<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <style>
    body {
      background-image: url('../images/general-.jpg');
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: rgba(255,255,255,0.75);
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 400px;
    }
    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 90%;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #4facfe;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #00c6ff; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Forgot Password</h2>
    <p>Enter your email to receive a reset link:</p>
    <input type="email" id="email" placeholder="Email" required>
    <button onclick="sendReset()">Send Reset Link</button>
  </div>

  <script>
    function sendReset() {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        alert('Please enter your email!');
        return;
      }

      // Simulate sending email (for demo purposes)
      alert('A reset link has been sent to ' + email);

      // Redirect to Reset Password page after 2 seconds
      setTimeout(() => {
        // Pass the email to the reset page using query string
        window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
      }, 2000);
    }
  </script>
</body>
</html>
