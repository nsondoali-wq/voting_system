<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Election</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: url('/images/vo mark.jpg');
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
      z-index: 1;
      position: relative;
    }

    h2 {
      color: #333;
      margin-bottom: 25px;
    }

    .btn {
      text-decoration: none;
      background-color: #4facfe;
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      display: block;
      width: 100%;
      font-weight: bold;
      margin-bottom: 15px;
      transition: background-color 0.3s;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background-color: #00c6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🗳 Select the Election</h2>
    <form action="vote.html" method="get">
      <button type="submit" class="btn" name="election" value="president">Vote for President</button>
      <button type="submit" class="btn" name="election" value="class_rep">Vote for Class Rep</button>
      <button type="submit" class="btn" name="election" value="guild_council">Vote for student Council</button>
    </form>
  </div>
</body>
</html>
