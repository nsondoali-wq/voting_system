<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Digital Voting</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --danger: #e74c3c;
            --light: #ffffff;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #2c3e50, #3498db);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: "Segoe UI", sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.2);
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #dcdcdc;
        }

        input {
            width: 100%;
            padding: 13px 15px 13px 45px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--secondary);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .message {
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .success { color: #2ecc71; }
        .error   { color: var(--danger); }

        .footer {
            margin-top: 20px;
            text-align: center;
        }

        .footer a {
            color: #ecf0f1;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Forgot Password?</h2>
        <p>Enter your registered email to receive a password recovery link.</p>

        <div class="message" id="messageBox"></div>

        <form id="forgotForm">
            <div class="form-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <button type="submit">Send Recovery Email</button>
        </form>

        <div class="footer">
            <p><a href="login.html">Back to Login</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById("forgotForm");
        const messageBox = document.getElementById("messageBox");

        form.addEventListener("submit", async function(e){
            e.preventDefault();

            const email = document.getElementById("email").value;

            try {
                const response = await fetch("http://localhost:3000/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                messageBox.style.display = "block";

                if(data.success){
                    messageBox.className = "message success";
                    messageBox.innerHTML = "<i class='fas fa-check-circle'></i> " + data.message;
                    messageBox.innerHTML += "<br>Please check your email to reset your password.";
                } else {
                    messageBox.className = "message error";
                    messageBox.innerHTML = "<i class='fas fa-exclamation-circle'></i> " + data.message;
                }
            } catch(err){
                messageBox.style.display = "block";
                messageBox.className = "message error";
                messageBox.innerHTML = "Server error. Please try again.";
            }
        });
    </script>
</body>
</html>
